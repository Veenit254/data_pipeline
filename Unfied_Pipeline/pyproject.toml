[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-unified-pipeline"
version = "0.2.0"
description = "Unified NSE quantitative market-data, qualitative document, delisted-company archive, and Z-factor standardization pipeline."
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "xlrd>=2.0",
    "html5lib>=1.1",
]

[project.optional-dependencies]
ocr = [
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.0",
    "pyflakes>=3.2",
]

[project.scripts]
company-pipeline = "company_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
