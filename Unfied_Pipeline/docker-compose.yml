# Local SearXNG metasearch for the collector: http://localhost:8082 (JSON enabled).
#   cp .env.example .env    # then put a random secret in it: openssl rand -hex 32
#   docker compose up -d
services:
  searxng:
    image: searxng/searxng:2026.7.11-62a1ab7ed   # pinned: the version this project was tested with
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8082}:8080"   # local only
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (see .env.example)}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    restart: unless-stopped

volumes:
  searxng-cache:
